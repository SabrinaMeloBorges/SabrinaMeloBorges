name: Gerar snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5B21B6&color_dots=#ebedf0,#DDD6FE,#C4B5FD,#8B5CF6,#5B21B6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7DD3FC&color_dots=#161b22,#3B2F6B,#5B21B6,#8B5CF6,#C4B5FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
